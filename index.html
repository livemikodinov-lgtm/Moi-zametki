<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a8e66b">
<meta name="description" content="Личные заметки с локальным хранением и временными записями">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Мои заметки</title>
<style>
:root{--bg:#101b17;--panel:#1d3027;--panel2:#263b30;--accent:#a8e66b;--text:#f4f8f2;--muted:#a9c1b1;--line:#344a3d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:#17301b;font-weight:700}
button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button.danger{background:#5b2d2d;color:#ffe4e4}
input,textarea,select{width:100%;background:#13221b;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px;outline:none}
textarea{min-height:90px;resize:vertical}.app{max-width:760px;margin:auto;padding:18px 15px 40px}.top{display:flex;align-items:center;gap:12px;margin:6px 0 20px}.logo{width:48px;height:48px;border-radius:15px;background:var(--accent);display:grid;place-items:center;color:#17301b;font-size:25px}.top h1{font-size:23px;margin:0}.muted{color:var(--muted);font-size:13px}.spacer{flex:1}.actions{display:flex;gap:8px;flex-wrap:wrap}.section-head{display:flex;align-items:center;gap:10px;margin:22px 0 12px}.section-head h2{font-size:18px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.topic{position:relative;text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:17px;padding:15px;min-height:112px;display:flex;flex-direction:column;gap:8px}.topic .emoji{font-size:23px}.topic .name{font-weight:750;font-size:17px;overflow-wrap:anywhere}.topic .count{font-size:12px;color:var(--muted)}.topic .dots{position:absolute;right:10px;top:8px;color:var(--muted);padding:4px;background:transparent}.row{display:flex;align-items:center;gap:8px}.row>*{min-width:0}.back{background:transparent;color:var(--text);padding:6px 0}.hidden{display:none!important}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.subtopic{display:flex;justify-content:space-between;gap:10px;align-items:center}.subtopic h3{margin:0;font-size:17px;overflow-wrap:anywhere}.bullet{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.bullet:last-child{border-bottom:0}.bullet .bullet-text{white-space:pre-wrap;overflow-wrap:anywhere;flex:1}.bullet .edit{padding:5px 8px;background:transparent;color:var(--muted)}.empty{text-align:center;padding:30px 12px;color:var(--muted)}.form{display:grid;gap:11px}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:5}.dialog{background:var(--bg);border:1px solid var(--line);border-radius:22px 22px 16px 16px;padding:18px;width:100%;max-width:560px;max-height:90vh;overflow:auto}.dialog h2{margin:0 0 14px}.dialog-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.label{display:block;color:var(--muted);font-size:13px;margin:2px 0 6px}.notice{background:#293b2c;border:1px solid #476644;color:#dff7cf;padding:11px;border-radius:12px;font-size:13px;margin:12px 0}.temp-note{border-left:4px solid #f1c87a}.temp-note .expires{font-size:12px;color:#f1c87a}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.settings-grid input[type=color]{height:45px;padding:4px}
.rich-editor{min-height:150px;max-height:48vh;overflow:auto;background:#13221b;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px;outline:none;overflow-wrap:anywhere}.rich-editor:empty:before{content:attr(data-placeholder);color:var(--muted)}.rich-editor img{display:block;max-width:100%;height:auto;border-radius:10px;margin:10px 0}.rich-editor p{margin:0 0 8px}.rich-preview img{display:block;max-width:100%;height:auto;border-radius:10px;margin:10px 0}.rich-preview p{margin:0 0 8px}
@media(min-width:600px){.app{padding:28px 22px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.modal{align-items:center}.dialog{border-radius:22px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">✎</div>
    <div><h1>Мои заметки</h1><div class="muted">Личное пространство</div></div>
    <div class="spacer"></div>
    <button class="secondary" id="settingsBtn" aria-label="Настройки">⚙</button>
  </header>

  <main id="homeView">
    <div class="notice">Заметки сохраняются на этом устройстве в браузере. Экспортируй резервную копию в настройках.</div>
    <div class="section-head"><h2>Мои темы</h2><div class="spacer"></div><button id="addTopicBtn">＋ Тема</button></div>
    <div id="topicsGrid" class="grid"></div>
    <div class="section-head"><h2>Временные заметки</h2><div class="spacer"></div><button id="addTempBtn">＋ Записать</button></div>
    <div class="muted">Каждая запись автоматически удаляется через 24 часа после создания.</div>
    <div id="tempList"></div>
  </main>

  <main id="topicView" class="hidden">
    <button class="back" id="backBtn">← Все темы</button>
    <div class="section-head"><div style="flex:1"><h2 id="topicTitle">Тема</h2><div class="muted" id="topicSubtitle"></div></div><button class="secondary" id="editTopicBtn">Настроить</button></div>
    <div class="actions" style="margin-bottom:14px"><button id="addSubBtn">＋ Подтема</button><button class="secondary" id="addBulletBtn">＋ Пункт</button></div>
    <div id="subtopicList"></div>
  </main>
</div>
<div id="modalRoot"></div>
<script>
const $=id=>document.getElementById(id);
const KEY='moi-zametki-v1';
const defaultData={topics:[],temps:[],settings:{accent:'#a8e66b',text:'#f4f8f2',bg:'#101b17'}};
let data=load(), currentTopic=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{topics:[],temps:[],settings:{accent:'#a8e66b',text:'#f4f8f2',bg:'#101b17'}}}catch(e){return structuredClone(defaultData)}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));applySettings()}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function applySettings(){const s=data.settings||defaultData.settings;document.documentElement.style.setProperty('--accent',s.accent||'#a8e66b');document.documentElement.style.setProperty('--text',s.text||'#f4f8f2');document.documentElement.style.setProperty('--bg',s.bg||'#101b17');document.querySelector('meta[name="theme-color"]').content=s.accent||'#a8e66b'}
function openModal(title,html,onSave,extra=''){ $('modalRoot').innerHTML=`<div class="modal" id="modal"><div class="dialog"><h2>${title}</h2><div class="form">${html}</div><div class="dialog-actions"><button id="modalSave">Сохранить</button><button class="secondary" id="modalCancel">Отмена</button>${extra}</div></div></div>`;$('modalCancel').onclick=closeModal;$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});$('modalSave').onclick=()=>onSave()}
function closeModal(){$('modalRoot').innerHTML=''}
function showHome(){$('homeView').classList.remove('hidden');$('topicView').classList.add('hidden');currentTopic=null;render()}
function showTopic(tid){currentTopic=tid;$('homeView').classList.add('hidden');$('topicView').classList.remove('hidden');renderTopic()}
function render(){applySettings();const grid=$('topicsGrid');grid.innerHTML='';if(!data.topics.length)grid.innerHTML='<div class="empty" style="grid-column:1/-1">Пока нет тем.<br>Нажми «＋ Тема», чтобы создать первую.</div>';
data.topics.forEach(t=>{const count=t.subtopics.reduce((n,s)=>n+s.items.length,0);const b=document.createElement('button');b.className='topic';b.style.borderColor=t.color||'var(--line)';b.innerHTML=`<span class="emoji">${esc(t.emoji||'▣')}</span><span class="name" style="color:${esc(t.textColor||'var(--text)')}">${esc(t.name)}</span><span class="count">${t.subtopics.length} подтем · ${count} пунктов</span><span class="dots">•••</span>`;b.onclick=e=>{if(e.target.classList.contains('dots')){editTopic(t.id)}else showTopic(t.id)};grid.appendChild(b)});
const now=Date.now();data.temps=data.temps.filter(n=>n.created+86400000>now);localStorage.setItem(KEY,JSON.stringify(data));
const list=$('tempList');list.innerHTML='';if(!data.temps.length)list.innerHTML='<div class="empty">Здесь пока пусто</div>';data.temps.slice().sort((a,b)=>b.created-a.created).forEach(n=>{const d=document.createElement('div');d.className='card temp-note';d.innerHTML=`<div class="row"><div class="bullet-text" style="white-space:pre-wrap;flex:1">${esc(n.text)}</div><button class="edit" aria-label="Удалить">✕</button></div><div class="expires">Удалится через ${remaining(n.created+86400000)}</div>`;d.querySelector('button').onclick=()=>{data.temps=data.temps.filter(x=>x.id!==n.id);save();render()};list.appendChild(d)})}
function remaining(ms){let m=Math.max(0,Math.ceil((ms-Date.now())/60000)),h=Math.floor(m/60),r=m%60;return h?`${h} ч ${r} мин`:`${r} мин`}
function addTopic(){openModal('Новая тема',`<label class="label">Название</label><input id="fName" placeholder="Например, Учёба" maxlength="60" required><label class="label">Значок (можно оставить пустым)</label><input id="fEmoji" placeholder="📚" maxlength="4"><div class="settings-grid"><div><label class="label">Цвет темы</label><input type="color" id="fColor" value="#a8e66b"></div><div><label class="label">Цвет текста</label><input type="color" id="fTextColor" value="#f4f8f2"></div></div>`,()=>{let name=$('fName').value.trim();if(!name){$('fName').focus();return}data.topics.push({id:id(),name,emoji:$('fEmoji').value.trim()||'▣',color:$('fColor').value,textColor:$('fTextColor').value,subtopics:[]});save();closeModal();render()})}
function editTopic(tid){const t=data.topics.find(x=>x.id===tid);if(!t)return;openModal('Настройки темы',`<label class="label">Название</label><input id="fName" value="${esc(t.name)}" maxlength="60"><label class="label">Значок</label><input id="fEmoji" value="${esc(t.emoji||'▣')}" maxlength="4"><div class="settings-grid"><div><label class="label">Цвет темы</label><input type="color" id="fColor" value="${t.color||'#a8e66b'}"></div><div><label class="label">Цвет текста</label><input type="color" id="fTextColor" value="${t.textColor||'#f4f8f2'}"></div></div>`,()=>{const name=$('fName').value.trim();if(!name)return;t.name=name;t.emoji=$('fEmoji').value.trim()||'▣';t.color=$('fColor').value;t.textColor=$('fTextColor').value;save();closeModal();render();if(currentTopic)renderTopic()},`<button class="danger" id="deleteTopicBtn">Удалить тему</button>`);$('deleteTopicBtn').onclick=()=>{if(confirm('Удалить тему вместе со всеми подтемами и пунктами?')){data.topics=data.topics.filter(x=>x.id!==tid);save();closeModal();showHome()}}}
function renderTopic(){const t=data.topics.find(x=>x.id===currentTopic);if(!t){showHome();return}$('topicTitle').textContent=t.name;$('topicTitle').style.color=t.textColor||'var(--text)';$('topicSubtitle').textContent=`${t.subtopics.length} подтем`;const list=$('subtopicList');list.innerHTML='';if(!t.subtopics.length)list.innerHTML='<div class="empty">Создай подтему или добавь первый пункт.</div>';t.subtopics.forEach(s=>{const card=document.createElement('section');card.className='card';card.innerHTML=`<div class="subtopic"><h3>${esc(s.name)}</h3><div class="actions"><button class="secondary editSub">✎</button><button class="secondary addIn">＋</button></div></div><div class="muted">${s.items.length} пунктов</div><div class="items"></div>`;card.querySelector('.editSub').onclick=()=>editSubtopic(s.id);card.querySelector('.addIn').onclick=()=>addBullet(s.id);const items=card.querySelector('.items');if(!s.items.length)items.innerHTML='<div class="muted" style="padding-top:12px">Пока нет пунктов</div>';s.items.forEach(it=>{const row=document.createElement('div');row.className='bullet';const content=it.body?cleanRichHtml(it.body):esc(it.text||'').replace(/\n/g,'<br>');row.innerHTML=`<div class="bullet-text rich-preview" style="color:${esc(it.color||t.textColor||'var(--text)')}">${content}</div><button class="edit">✎</button>`;row.querySelector('button').onclick=()=>editBullet(s.id,it.id);items.appendChild(row)});list.appendChild(card)})}
function addSubtopic(){const t=data.topics.find(x=>x.id===currentTopic);if(!t)return;openModal('Новая подтема',`<label class="label">Название подтемы</label><input id="fName" placeholder="Например, Подготовка к экзамену" maxlength="80">`,()=>{let name=$('fName').value.trim();if(!name)return;t.subtopics.push({id:id(),name,items:[]});save();closeModal();renderTopic()})}
function editSubtopic(sid){const t=data.topics.find(x=>x.id===currentTopic),s=t.subtopics.find(x=>x.id===sid);if(!s)return;openModal('Изменить подтему',`<label class="label">Название</label><input id="fName" value="${esc(s.name)}" maxlength="80">`,()=>{let name=$('fName').value.trim();if(!name)return;s.name=name;save();closeModal();renderTopic()},`<button class="danger" id="deleteSubBtn">Удалить</button>`);$('deleteSubBtn').onclick=()=>{if(confirm('Удалить подтему и все её пункты?')){t.subtopics=t.subtopics.filter(x=>x.id!==sid);save();closeModal();renderTopic()}}}
function cleanRichHtml(html){
  const doc=new DOMParser().parseFromString(String(html||''),'text/html');
  const allowed=new Set(['DIV','P','BR','B','STRONG','I','EM','U','UL','OL','LI','IMG']);
  function clean(node){let out='';node.childNodes.forEach(ch=>{if(ch.nodeType===3){out+=esc(ch.nodeValue)}else if(ch.nodeType===1){const tag=ch.tagName;if(!allowed.has(tag)){out+=clean(ch);return}if(tag==='IMG'){const src=ch.getAttribute('src')||'';if(src.startsWith('data:image/jpeg;base64,')||src.startsWith('data:image/png;base64,')){out+=`<img src="${src}" alt="Прикреплённое фото">`}return}out+=`<${tag.toLowerCase()}>${clean(ch)}</${tag.toLowerCase()}>`}});return out}
  return clean(doc.body);
}
function editorHtml(item){if(item.body)return cleanRichHtml(item.body);return esc(item.text||'').replace(/\n/g,'<br>')}
function setupRichEditor(initialHtml=''){
  const ed=$('fEditor');ed.innerHTML=initialHtml;let savedRange=null;
  function remember(){const sel=window.getSelection();if(sel&&sel.rangeCount&&ed.contains(sel.anchorNode))savedRange=sel.getRangeAt(0).cloneRange()}
  ed.addEventListener('keyup',remember);ed.addEventListener('mouseup',remember);ed.addEventListener('input',remember);
  const file=$('fImage');$('insertImageBtn').onclick=()=>{remember();file.click()};
  file.onchange=async()=>{const f=file.files&&file.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('Выбери файл изображения.');file.value='';return}try{const src=await compressImage(f);ed.focus();const sel=window.getSelection();if(savedRange){sel.removeAllRanges();sel.addRange(savedRange)}else{const r=document.createRange();r.selectNodeContents(ed);r.collapse(false);sel.removeAllRanges();sel.addRange(r)}const img=document.createElement('img');img.src=src;img.alt='Прикреплённое фото';const r=sel.getRangeAt(0);r.deleteContents();r.insertNode(img);const br=document.createElement('p');br.innerHTML='<br>';img.after(br);const after=document.createRange();after.setStart(br,0);after.collapse(true);sel.removeAllRanges();sel.addRange(after);savedRange=after.cloneRange();file.value=''}catch(e){alert('Не удалось добавить фотографию. Попробуй изображение поменьше.')}};
}
function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.78))};img.src=reader.result};reader.readAsDataURL(file)})}
function addBullet(sid=null){const t=data.topics.find(x=>x.id===currentTopic);if(!t)return;let sub=sid?t.subtopics.find(x=>x.id===sid):null;if(!sub){if(t.subtopics.length===1)sub=t.subtopics[0];else if(t.subtopics.length>1){openModal('Выбери подтему',`<label class="label">Подтема</label><select id="fSub">${t.subtopics.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>`,()=>{const chosen=$('fSub').value;closeModal();addBullet(chosen||t.subtopics[0].id)});return}else{alert('Сначала создай подтему.');return}}
openModal('Новый пункт',`<label class="label">Текст и фотографии</label><div class="muted">Нажми в нужное место текста и добавь фото — оно появится прямо внутри заметки.</div><div id="fEditor" class="rich-editor" contenteditable="true" data-placeholder="Начни писать заметку…"></div><input id="fImage" type="file" accept="image/*" class="hidden"><button type="button" class="secondary" id="insertImageBtn">▧ Добавить фотографию</button><label class="label">Цвет текста</label><input type="color" id="fColor" value="${t.textColor||'#f4f8f2'}">`,()=>{const ed=$('fEditor');const body=cleanRichHtml(ed.innerHTML).trim();const plain=(ed.innerText||'').trim();if(!plain&&!body.includes('<img'))return;try{sub.items.push({id:id(),text:plain,body,color:$('fColor').value});save();closeModal();renderTopic()}catch(e){alert('Не удалось сохранить заметку. Возможно, фотография слишком большая или в хранилище закончилось место. Экспортируй резервную копию и попробуй фото меньшего размера.')}},'');setupRichEditor('')}
function editBullet(sid,iid){const t=data.topics.find(x=>x.id===currentTopic),s=t.subtopics.find(x=>x.id===sid),it=s.items.find(x=>x.id===iid);if(!it)return;openModal('Изменить пункт',`<label class="label">Текст и фотографии</label><div class="muted">Поставь курсор в нужное место, чтобы добавить фотографию между фрагментами текста.</div><div id="fEditor" class="rich-editor" contenteditable="true" data-placeholder="Текст заметки…"></div><input id="fImage" type="file" accept="image/*" class="hidden"><button type="button" class="secondary" id="insertImageBtn">▧ Добавить фотографию</button><label class="label">Цвет текста</label><input type="color" id="fColor" value="${it.color||t.textColor||'#f4f8f2'}">`,()=>{const ed=$('fEditor');const body=cleanRichHtml(ed.innerHTML).trim();const plain=(ed.innerText||'').trim();if(!plain&&!body.includes('<img'))return;try{it.text=plain;it.body=body;it.color=$('fColor').value;save();closeModal();renderTopic()}catch(e){alert('Не удалось сохранить заметку. Возможно, фотография слишком большая или в хранилище закончилось место. Экспортируй резервную копию и попробуй фото меньшего размера.')}},`<button class="danger" id="deleteItemBtn">Удалить пункт</button>`);setupRichEditor(editorHtml(it));$('deleteItemBtn').onclick=()=>{if(confirm('Удалить этот пункт?')){s.items=s.items.filter(x=>x.id!==iid);save();closeModal();renderTopic()}}}
function addTemp(){openModal('Временная заметка',`<label class="label">Текст (удалится через 24 часа)</label><textarea id="fText" placeholder="Быстро записать и забыть…"></textarea>`,()=>{let text=$('fText').value.trim();if(!text)return;data.temps.push({id:id(),text,created:Date.now()});save();closeModal();render()})}
function settings(){openModal('Настройки приложения',`<div class="notice">Данные находятся в хранилище этого браузера на телефоне. Не очищай данные браузера, пока не сделаешь экспорт.</div><div class="settings-grid"><div><label class="label">Акцентный цвет</label><input type="color" id="sAccent" value="${data.settings.accent||'#a8e66b'}"></div><div><label class="label">Цвет основного текста</label><input type="color" id="sText" value="${data.settings.text||'#f4f8f2'}"></div></div><div><label class="label">Цвет фона</label><input type="color" id="sBg" value="${data.settings.bg||'#101b17'}"></div><button class="secondary" id="exportBtn" type="button">Экспорт резервной копии</button><label class="label">Импорт резервной копии JSON</label><input type="file" id="importFile" accept=".json,application/json">`,()=>{data.settings={accent:$('sAccent').value,text:$('sText').value,bg:$('sBg').value};save();closeModal();render()},`<button class="secondary" id="resetStyleBtn">Сбросить цвета</button>`);$('exportBtn').onclick=exportData;$('importFile').onchange=importData;$('resetStyleBtn').onclick=()=>{data.settings={...defaultData.settings};save();closeModal();render()}}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moi-zametki-backup.json';a.click();URL.revokeObjectURL(url)}
function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!x||!Array.isArray(x.topics)||!Array.isArray(x.temps))throw Error();if(confirm('Импорт заменит текущие заметки. Продолжить?')){data=x;save();closeModal();showHome()}}catch(err){alert('Не удалось прочитать резервную копию.')}};reader.readAsText(file)}
